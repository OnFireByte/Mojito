[workspace]
resolver = "3"
members = ["crates/mojito-core", "crates/mojito-macos", "crates/mojito"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
arc-swap = "1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
block2 = "0.6.2"
core-graphics-types = "0.1.3"

[profile.release]
strip = true
